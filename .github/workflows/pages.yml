name: Deploy website

# The landing page is plain static files in website/dist — no build step.
# Publishing it here keeps the site's URL stable at
# https://attila-krb.github.io/Fold/ without touching the appcast, which is
# served from docs/appcast.xml on main.
on:
  push:
    branches: [main]
    paths:
      - 'website/dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - id: deployment
        uses: actions/deploy-pages@v4
