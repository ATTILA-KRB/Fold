name: Build macOS app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build checked-in Xcode project
        run: |
          if ! xcrun metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcodebuild -project Fold.xcodeproj -scheme Fold -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY=- build
      - name: Verify animation math
        run: |
          swiftc Fold/BendMath.swift Tests/main.swift -o /tmp/fold-tests
          /tmp/fold-tests
      - uses: actions/upload-artifact@v4
        with:
          name: Fold-build
          path: build/Build/Products/Release/Fold.app
