name: Fold
options:
  bundleIdPrefix: com.attila-krb
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: '14.0'
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  Fold:
    type: application
    platform: macOS
    sources: [Fold]
    info:
      path: Fold/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        CFBundleIconFile: AppIcon
        SUFeedURL: https://raw.githubusercontent.com/ATTILA-KRB/Fold/main/docs/appcast.xml
        SUPublicEDKey: 'Wqj3SXKxnYgGMg4W3JyX34BTEyOMPH4F5yub2u8kjgo='
        SUVerifyUpdateBeforeExtraction: true
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 21600
        SUAutomaticallyUpdate: false
        SUSendProfileInfo: false
    entitlements:
      path: Fold/Fold.entitlements
      properties:
        # Ad-hoc signatures have no Team ID for matching the embedded framework.
        # Remove this exception when migrating to Developer ID distribution.
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.attila-krb.Fold
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: 'Copyright 2026 Fold contributors. MIT License.'
        INFOPLIST_KEY_CFBundleDisplayName: Fold
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
    dependencies:
      - package: Sparkle
      - sdk: AppKit.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: MetalKit.framework
      - sdk: IOKit.framework
      - sdk: Carbon.framework
